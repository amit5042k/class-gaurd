name: Test and build

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries (Qt, GStreamer RTSP server for the camera simulator)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            gstreamer1.0-rtsp gir1.2-gst-rtsp-server-1.0 python3-gi \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly
      - name: Python packages
        run: |
          pip install -r requirements-dev.txt "setuptools<81" dlib-bin face_recognition_models \
            Click Pillow scikit-image onnx
          pip install --no-deps face_recognition
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python packages
        run: |
          pip install -r requirements-dev.txt pyinstaller "setuptools<81" dlib-bin `
            face_recognition_models Click Pillow scikit-image onnx
          pip install --no-deps face_recognition
      - name: Tests (camera simulator test is skipped on Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Build app
        run: pyinstaller classguard.spec --noconfirm
      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process dist\ClassGuard\ClassGuard.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content classguard-selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ClassGuard-Windows-Setup
          path: dist/ClassGuard-Setup-*.exe
